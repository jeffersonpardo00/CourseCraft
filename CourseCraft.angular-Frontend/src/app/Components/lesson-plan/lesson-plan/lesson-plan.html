<ng-container *ngFor="let lessonGUI of lessons; let i = index">
  <button 
    class="accordion" 
    [class.active]="lessonGUI.isOpen"
    (click)="toggleAccordion(i)">
    {{ lessonGUI.lesson.title }}
  </button>
  <div class="panel" [class.open]="lessonGUI.isOpen">
    <app-lesson [content]="lessonGUI.lesson.content"></app-lesson>
  </div>
</ng-container>
